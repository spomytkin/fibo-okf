[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "owl2okf"
version = "0.1.0"
description = "Reproducibly convert FIBO OWL ontologies into Open Knowledge Format 0.2 bundles"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["rdflib==7.6.0", "PyYAML==6.0.3"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.scripts]
owl2okf = "owl2okf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
owl2okf = ["profiles/fibo/profile.yaml"]
